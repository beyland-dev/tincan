name: Release

# Pushing a v* tag builds, verifies and (after approval in the `release` environment) publishes.
# workflow_dispatch with dry_run (the default) builds everything and runs `npm publish --dry-run`
# without creating a GitHub Release or publishing to npm.
#
# Trust boundaries: jobs that run `pnpm install` (third-party code) have read-only tokens. The
# privileged jobs only download artifacts, attest them, and publish them; no caches anywhere.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify artifacts without creating a GitHub Release or publishing to npm"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 12.14.0
  # The npm jobs run on Node 24 LTS: trusted publishing (OIDC) needs npm >= 11.5.1, which Node 24
  # bundles, so nothing is installed outside a lockfile. Node 22.18 ships npm 10.
  NPM_NODE_VERSION: 24.11.0

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
      npm-tag: ${{ steps.versions.outputs.npm-tag }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: mode
        name: Publish or dry run
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [ "$REF_TYPE" = tag ] && { [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; }; then
            publish=true
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ] && [ "$REF_TYPE" != tag ]; then
            echo "::error::A non-dry-run release must be dispatched on a v* tag, not a branch."
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish: $publish"
      - id: versions
        name: Tag and package versions agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # Fails unless every package.json, Cargo.toml/Cargo.lock and the napi loader are at
            # the tag's version, and never accepts 0.0.0.
            node scripts/check-release-version.mjs --tag "$REF_NAME"
          else
            # Branch dry run: versions must agree, 0.0.0 is allowed because nothing is published.
            node scripts/check-release-version.mjs --allow-unversioned
          fi

  checks:
    name: Checks
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  native:
    name: Native addon (${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35, OpenSSL 3.0) is the oldest supported build host; building
          # on 24.04 pulls in GLIBC_2.38 symbols (e.g. __isoc23_strtol from SQLCipher's C code).
          - target: x86_64-unknown-linux-gnu
            arch: x64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @beyland/tincan-native exec napi build --platform --release --target "$TARGET" --manifest-path ../../crates/tincan-napi/Cargo.toml --output-dir . --esm
      - name: Generated bindings are committed
        run: git diff --exit-code -- packages/native/index.d.ts packages/native/index.js
      - name: glibc floor (<= 2.35)
        run: node scripts/check-glibc.mjs --max-glibc 2.35 packages/native/*.node
      - run: pnpm --filter @beyland/tincan-native test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: packages/native/*.node
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.arch }})
    needs: [guard, native]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.arch }}
          path: packages/native
      - run: pnpm build
      - run: pnpm --filter @beyland/tincan-desktop stage:daemon
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: pnpm --filter @beyland/tincan-desktop exec electron-builder --linux "--$ARCH" --publish never
      # AppImageUpdate and AppImageLauncher read update information from the AppImage and fetch
      # the matching .zsync from the latest release. Tincan itself never checks for updates.
      - name: Embed AppImage update information and make its zsync file
        env:
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsync
          label=x86_64; [ "$ARCH" = arm64 ] && label=arm64
          cd apps/desktop/release
          for f in *.AppImage; do
            node ../../../scripts/appimage-update-info.mjs "$f" \
              "gh-releases-zsync|${REPO%%/*}|${REPO#*/}|latest|Tincan-*-linux-${label}.AppImage.zsync"
            zsyncmake -u "$f" -o "$f.zsync" "$f"
          done
          ls -l
      - name: Smoke-test packaged daemon bundle
        env:
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          release_dir="$PWD/apps/desktop/release"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for f in "$release_dir"/*.AppImage; do
            (cd "$tmp" && "$f" --appimage-extract >/dev/null)
            actual="$(APPDIR="$tmp/squashfs-root" ELECTRON_RUN_AS_NODE=1 "$tmp/squashfs-root/tincan-desktop" -e '
              const bin = process.env.APPDIR + "/resources/daemon/dist/bin.mjs";
              process.argv.splice(1, 0, bin);
              await import(bin);
            ' -- --version)"
            echo "$(basename "$f") --version => $actual"
            test "$actual" = "$EXPECTED_VERSION"
            APPDIR="$tmp/squashfs-root" ELECTRON_RUN_AS_NODE=1 "$tmp/squashfs-root/tincan-desktop" -e '
              const mod = await import(process.env.APPDIR + "/resources/daemon/node_modules/@beyland/tincan-native/index.js");
              if (typeof mod.Vault !== "function") throw new Error("native addon failed to load");
              console.log("native addon loaded ok");
            '
            rm -rf "$tmp/squashfs-root"
          done
          for f in "$release_dir"/*.deb; do
            dpkg-deb -c "$f" | grep -q "resources/daemon/node_modules/@beyland/tincan-native/tincan-native\.linux-.*\.node"
            echo "$(basename "$f") contains bundled native addon"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.zsync
            apps/desktop/release/*.deb
          if-no-files-found: error

  npm-pack:
    name: Pack npm tarballs
    needs: [guard, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: packages/native/artifacts
          merge-multiple: true
      - run: pnpm build
      - name: Pack and verify tarballs
        run: node scripts/pack-npm.mjs --out npm-tarballs --artifacts packages/native/artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: |
            npm-tarballs/*.tgz
            npm-tarballs/manifest.json
          if-no-files-found: error

  npm-dry-run:
    name: npm publish --dry-run
    needs: [guard, checks, desktop, npm-pack]
    if: needs.guard.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NPM_NODE_VERSION }}
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e '
            const [a, b, c] = require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
      - name: npm publish --dry-run
        env:
          TARBALLS: ${{ runner.temp }}/npm-tarballs
          NPM_TAG: ${{ needs.guard.outputs.npm-tag }}
        run: node scripts/publish-npm.mjs --dir "$TARBALLS" --tag "$NPM_TAG" --dry-run

  publish-npm:
    name: Publish npm packages
    # Nothing is published unless every check, both desktop builds and packing succeeded.
    needs: [guard, checks, native, desktop, npm-pack]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/@beyland/tincan
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance, build attestations
      attestations: write
    steps:
      # Only our scripts are checked out; no dependencies are installed in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NPM_NODE_VERSION }}
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e '
            const [a, b, c] = require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
      - name: Attest npm tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/npm-tarballs/*.tgz
      - name: Publish (skips versions already on npm)
        env:
          TARBALLS: ${{ runner.temp }}/npm-tarballs
          NPM_TAG: ${{ needs.guard.outputs.npm-tag }}
          # Optional, one-time bootstrap only (packages must exist before trusted publishers can
          # be configured). Leave the secret unset to publish with OIDC trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs --dir "$TARBALLS" --tag "$NPM_TAG"

  github-release:
    name: GitHub Release
    needs: [guard, checks, native, desktop, npm-pack]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release
      id-token: write # build attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist-release
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist-release
        run: sha256sum *.AppImage *.AppImage.zsync *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS (if a signing key is configured)
        working-directory: dist-release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY is not set; skipping the detached signature."
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          else
            gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          fi
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/SHA256SUMS
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          shopt -s nullglob
          assets=(dist-release/*.AppImage dist-release/*.AppImage.zsync dist-release/*.deb dist-release/SHA256SUMS)
          if [ -f dist-release/SHA256SUMS.asc ]; then
            assets+=(dist-release/SHA256SUMS.asc)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rerun after a partial failure: replace the assets, keep the notes.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "Tincan $TAG" --generate-notes "${flags[@]}"
          fi
