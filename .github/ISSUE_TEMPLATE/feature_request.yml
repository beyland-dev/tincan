name: Feature Request
description: Suggest an improvement or new capability for Tincan
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why is it currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you'd like it to work (CLI, desktop UI, MCP, or daemon).
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Note: Tincan works strictly over Bluetooth MAP/PBAP/ANCS without an iOS companion app.
        Check the README's "What works (and what doesn't)" section for Bluetooth protocol limits.
