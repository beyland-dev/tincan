packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@modelcontextprotocol/client": ^2.3.1
  "@modelcontextprotocol/server": ^2.3.1
  "@napi-rs/cli": ^3.10.9
  "@preact/preset-vite": ^2.10.6
  "@preact/signals": ^2.11.3
  "@types/node": ^24
  electron: ^45.4.1
  electron-builder: ^26.18.0
  jsonc-parser: ^3.3.1
  libphonenumber-js: ^1.12.0
  lite-youtube-embed: ^0.4.0
  preact: ^11.0.1
  preact-iso: ^2.12.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  electron: true
  electron-winstaller: false
