[workspace]
members = ["crates/*"]
# The cargo-fuzz harness is its own workspace.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
# zbus 6 and rusqlite 0.43 need 1.89; Tincan's own code needs 1.88
# (`<[T]>::as_chunks`, let chains).
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/beyland-dev/tincan"
publish = false

[workspace.dependencies]
tincan-bt = { path = "crates/tincan-bt" }
tincan-vault = { path = "crates/tincan-vault" }
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt"] }
napi-build = "2"
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
tempfile = "3"
zeroize = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
